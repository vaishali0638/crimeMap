[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crimemap-worker"
version = "0.1.0"
description = "CRIMEMAP background jobs: IdP audit import, audit-chain verification, partitions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crimemap-api",  # shared domain package (ADR-001); installed from ../api
  "dramatiq[redis]>=2.2,<3",
  "httpx>=0.28,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crimemap_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "../api/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
# Line length is enforced by `ruff format`; long SQL literals and URLs are allowed (ruff docs).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crimemap_worker"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
