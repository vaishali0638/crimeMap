# CRIMEMAP Prometheus (observability profile) — DEMO / SYNTHETIC DATA.
# Scrapes the API's /metrics with a bearer token read from a Compose secret (never inline).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: crimemap-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

# No Alertmanager is configured in DEMO: alerts are visible in Prometheus and Grafana only.
# Production: route to the on-call channel named in docs/runbook.md §2 (an approved, internal
# Alertmanager; no third-party paging service without approval).
